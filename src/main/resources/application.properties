spring.application.name=balancr-api

# Comma-separated list of origins allowed to call the API (used by WebConfig CORS setup)
app.cors.allowed-origins=http://localhost:5173

# MySQL database, run via Docker Compose (see docker-compose.yml). "db" is the
# service name Compose gives the MySQL container, resolved via Docker's internal
# DNS - it only works when this app is itself running inside that Compose network.
spring.datasource.url=jdbc:mysql://db:3306/balancr
# Credentials come from environment variables (set by docker-compose.yml), never
# hardcoded here, so they can differ per environment without touching this file.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate still owns the schema: it reads the existing @Entity classes and
# creates/updates the matching MySQL tables automatically - same as it did
# against H2, just against a different database now.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
